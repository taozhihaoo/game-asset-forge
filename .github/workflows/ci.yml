name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      # The GUI is not launched in this job; skip the Electron binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Includes the build, the bugfix/docs integrity suites, and the
      # GUI/Core/CLI consistency tests. Real-world fixtures auto-skip.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  renderer-smoke:
    name: Renderer smoke (headless Chromium)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install headless Chromium
        run: npx playwright-core install chromium

      # Asserts both languages, the PixiJS canvas, sprite detection, the
      # composed atlas view and the Quality page — without writing files.
      - name: Verify bilingual renderer
        run: node scripts/capture-screenshots.mjs --check
